name: crashtest
on:
  push: { branches: [main, staging] }
  pull_request: { branches: [main, staging] }
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20 }
      - run: npm install --no-fund --no-audit
      - run: npm test
      # npm registry pin: crashtest 1.2.0 is unreleased on main, so the lane
      # pins the published 1.1.0. Bump the pin and the ledger together.
      - name: Install crashtest
        run: npm install --no-save --no-audit --no-fund crashtest@1.3.0
      - name: Run the manifest-shapes pack
        run: npx crashtest run
