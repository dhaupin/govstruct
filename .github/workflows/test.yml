name: test
on:
  push: { branches: [main, staging] }
  pull_request: { branches: [main, staging] }
  workflow_dispatch:

jobs:
  test:
    # Bounded: a stalled runner dies HERE (10 min) with its phase markers in
    # the log instead of hanging silently.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20 }
      - run: npm install --no-fund --no-audit
      - run: npm test
      # The check host over the nine source-consistency packs.
      - name: check battery
        run: npm run check
      # The rig gates: the docs lint, the birth gate (SHA-pinned actions),
      # the brand census (identity lives once, in site.config.js), the paint
      # scheme parity, and the sync drift check over the derived surfaces.
      - name: docs lint
        run: npm run lint:docs
      - name: rig gates (birth + census + theme parity + sync)
        run: npm run check:rig
      # The manifest grammar through the CLI, both ways: the reference roster
      # lints green, and a broken fixture family refuses.
      - name: lint the repo's own fixtures through the CLI (both ways)
        run: |
          node bin/cli.mjs lint test/fixtures/clean
          if node bin/cli.mjs lint test/fixtures/broken/id-mismatch >/dev/null 2>&1; then
            echo "lint should have refused the broken fixture"; exit 1
          fi
      - name: doctor the reference roster
        run: npm run doctor
      - name: the audit ledger verifies offline
        run: node bin/cli.mjs audit verify

      # eyestruct: armed, but wakes only when a visual home (labs/.eyes/) is
      # committed. `eyestruct gate` is browserless + read-only (exit 1 on
      # unexplained drift), so it needs no chrome. Canon is CI-cut (eyestruct's
      # own ratify lane); this battery only refuses drift. Issue #35.
      - name: Install eyestruct (pinned, parked until labs/.eyes lands)
        if: ${{ hashFiles('labs/.eyes/manifest.yml') != '' }}
        run: npm install --no-save --no-audit --no-fund eyestruct@1.1.0
      - name: Eyestruct gate (visual memory)
        if: ${{ hashFiles('labs/.eyes/manifest.yml') != '' }}
        run: node node_modules/eyestruct/bin/eyestruct.js gate
