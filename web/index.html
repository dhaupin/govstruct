<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Shell template. Do not add brand meta here directly.

    The npm prestruct engine's inject-brand pass populates these tags at
    build time from ssr.config.js (`prestruct build`):

      the title tag, description, author, keywords, canonical,
      Open Graph, Twitter Card, JSON-LD.

    (The comment avoids the literal title markup on purpose: prestruct's
    duplicate-title audit check is comment-blind -- a raw tag-name count --
    so this prose would read as a second title element and fail the build.
    The crashtest shell carries the same wording for the same reason.)

    The placeholder values below give the inject regex something to match.
    They are replaced before the site is deployed -- never served as-is.
  -->

  <!-- Primary SEO (populated by prestruct inject-brand) -->
  <!-- IDENTITY: fill these three (and everything marked YOUR...) with your brand -->
  <title>Your Site</title>
  <meta name="description" content="" />
  <meta name="keywords"    content="" />
  <meta name="author"      content="" />
  <meta name="robots"      content="index, follow" />
  <link rel="canonical"    href="https://your-site.example.com/" />

  <!--
    Favicons -- replace with your own.
    Generate from https://favicon.io or similar.
  -->  <!--
    Favicons + identity (real files ship in public/):
  -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#f5f6fa" />

  <script>
    // Theme + paint-scheme bootstrap: the default tokens are light/iris; apply
    // a persisted dark theme and a persisted paint scheme before the stylesheet
    // paints. Non-critical: wrapped in try in case storage is unavailable
    // (private mode). Keep the keys and the paper map in sync with src/theme.js,
    // ThemeSwitch.jsx, and SchemeSwitch.jsx (the meta color depends on BOTH axes).
    try {
      var paper = {
        iris:   { dark: '#10131a', light: '#f5f6fa' },
        petrol: { dark: '#0a1113', light: '#edf3f2' },
        golden: { dark: '#121011', light: '#f6f1e7' },
        jade:   { dark: '#121011', light: '#f6f1e7' }
      }
      var scheme = localStorage.getItem('site-paint-scheme') || 'iris'
      if (paper[scheme] && scheme !== 'iris') document.documentElement.dataset.scheme = scheme
      var dark = localStorage.getItem('site-theme') === 'dark'
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      var p = (paper[scheme] || paper.iris)[dark ? 'dark' : 'light']
      document.currentScript.previousElementSibling.setAttribute('content', p)
    } catch (e) {}
  </script>

  <!--
    Fonts -- add your font imports here if needed.
    Use <link rel="preconnect"> to warm the connection before the stylesheet.
  -->
</head>
<body>
  <div id="root"></div>
  <!-- Entry module: vite build compiles this into the hashed <script>+<link>
       pair in dist/index.html, which prerender keeps in every page. Without
       it, vite emits NOTHING from the app graph and the site ships as
       unstyled static HTML (found live: crashtest.creadev.org rendered
       themeless until this tag was restored - the prestruct example has it,
       the init template didn't). -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
